name: career-quest-tests
services:
  postgres-test:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: career_quest_test
      POSTGRES_PASSWORD: isolated-test-password
      POSTGRES_DB: career_quest_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_quest_test -d career_quest_test"]
      interval: 2s
      timeout: 2s
      retries: 30
