name: career-quest

x-application: &application
  build: .
  image: career-quest-backend:local
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql://${POSTGRES_USER:-career_quest}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-career_quest}?schema=public
    NODE_ENV: ${NODE_ENV:-development}
    PORT: 3001
    INPUT_DATA_DIR: /app/data/input

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career_quest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-career_quest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *application
    command: ["node_modules/.bin/prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap:
    <<: *application
    command: ["node", "dist/scripts/bootstrap.js"]
    volumes:
      - type: bind
        source: ${INPUT_DATA_DIR:-./data/input}
        target: /app/data/input
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *application
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
