<style>
  html { scroll-behavior:smooth; }
  body {
    background-color:#05120D;
    background-image:
      linear-gradient(rgba(167,243,207,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167,243,207,.045) 1px, transparent 1px);
    background-size:56px 56px;
    color:#E7F6EE;
  }
  ::selection { background:#3DE690; color:#05120D; }

  /* матовый полупрозрачный контейнер */
  .glass {
    background: rgba(12,36,28,.58);
    backdrop-filter: blur(12px) saturate(1.1);
    -webkit-backdrop-filter: blur(12px) saturate(1.1);
    border:1px solid rgba(167,243,207,.13);
  }
  .glass-soft {
    background: rgba(167,243,207,.045);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border:1px solid rgba(167,243,207,.12);
  }

  /* угловые инженерные скобки */
  .brackets { position:relative; }
  .brackets::before,.brackets::after,
  .brackets > .bk::before,.brackets > .bk::after {
    content:''; position:absolute; width:14px; height:14px;
    border:1.5px solid #3DE690;
  }
  .brackets::before { top:-1px; left:-1px; border-right:0; border-bottom:0; }
  .brackets::after  { top:-1px; right:-1px; border-left:0; border-bottom:0; }
  .brackets > .bk::before { bottom:-1px; left:-1px; border-right:0; border-top:0; }
  .brackets > .bk::after  { bottom:-1px; right:-1px; border-left:0; border-top:0; }

  .dash-anim { stroke-dasharray:6 8; animation:dash 30s linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-700; } }

  .marquee-track { display:flex; width:max-content; animation:marquee 26s linear infinite; }
  @keyframes marquee { to { transform:translateX(-50%); } }

  .reveal { opacity:0; transform:translateY(20px); transition:opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity:1; transform:none; }

  .row-vac { transition:background .25s ease; }
  .row-vac:hover { background:rgba(167,243,207,.05); }
  .row-vac.open { background:rgba(167,243,207,.06); }

  input:focus { outline:none; }
  .field { transition:border-color .2s ease, background .2s ease; }
  .field:focus-within { border-color:rgba(61,230,144,.6); background:rgba(61,230,144,.04); }

  #blueprint-wrap { transition:transform .25s ease-out; transform-style:preserve-3d; }

  .link-u { position:relative; }
  .link-u::after { content:''; position:absolute; left:0; bottom:-3px; height:1px; width:0; background:#3DE690; transition:width .25s ease; }
  .link-u:hover::after, .link-u.active::after { width:100%; }

  @keyframes toast-in { from { opacity:0; transform:translateY(12px);} to { opacity:1; transform:none;} }
  .toast { animation:toast-in .3s ease; }
</style>

function toast(msg, ok=true){
  const el = document.createElement('div');
  el.className = 'toast glass brackets px-4 py-3 rounded font-mono text-sm flex items-center gap-3 max-w-xs';
  el.innerHTML = `<span class="bk"></span><i data-lucide="${ok?'check-circle-2':'alert-triangle'}" class="w-4 h-4 ${ok?'text-acid':'text-red-400'} shrink-0"></i><span class="text-mint/90">${msg}</span>`;
  $('#toasts').appendChild(el);
  lucide.createIcons();
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3200);
}

function initReveal(){
  const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }), {threshold:.12});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
}

function countUp(el){
  const target = +el.dataset.count, suf = el.dataset.suffix || '';
  const t0 = performance.now(), dur = 1400;
  (function tick(t){
    const p = Math.min((t-t0)/dur, 1), e = 1-Math.pow(1-p,3);
    el.textContent = Math.round(target*e).toLocaleString('ru-RU') + suf;
    if(p<1) requestAnimationFrame(tick);
  })(t0);
}
function initCounters(){
  const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ countUp(e.target); io.unobserve(e.target);} }), {threshold:.5});
  document.querySelectorAll('[data-count]').forEach(el => io.observe(el));
}

    <button class="w-full text-left grid grid-cols-[auto_1fr_auto] md:grid-cols-[64px_1fr_130px_170px_48px] gap-4 items-center px-5 md:px-6 py-5">
      <span class="font-mono text-xs text-fog">${String(i+1).padStart(2,'0')}</span>
      <span>
        <span class="block font-medium">${v.title}</span>
        <span class="block font-mono text-[11px] text-fog mt-1 uppercase tracking-widest">${v.team} · ${v.loc}</span>
      </span>
      <span class="hidden md:inline font-mono text-xs text-acid tracking-widest">${v.level}</span>
      <span class="hidden md:inline font-mono text-xs text-mint/80 text-right">${v.salary}</span>
      <span class="justify-self-end"><i data-lucide="plus" class="w-4 h-4 text-fog row-icon transition-transform"></i></span>

      <div class="flex flex-col md:flex-row md:items-center gap-5 justify-between border-t border-mint/10 pt-4">
        <div class="max-w-xl">
          <p class="text-sm text-mint/70 leading-relaxed">${v.desc}</p>
          <div class="flex flex-wrap gap-2 mt-3">${v.tags.map(t=>`<span class="font-mono text-[10px] uppercase tracking-widest px-2.5 py-1 rounded border border-mint/20 text-mint/70">${t}</span>`).join('')}</div>
        </div>
        <button data-apply="${v.id}" class="shrink-0 inline-flex items-center gap-2 font-mono text-xs uppercase tracking-widest px-5 py-3 rounded transition-colors ${applied?'bg-acid/15 text-acid border border-acid/40':'bg-acid text-ink-950 hover:bg-mint'}">
          <i data-lucide="${applied?'check':'send'}" class="w-3.5 h-3.5"></i>${applied?'Отклик отправлен':'Откликнуться'}
        </button>
      </div>
    </div>
  </div>`;
}

function bindVacancies(){
  document.querySelectorAll('.row-vac > button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = btn.parentElement, panel = row.querySelector('[data-panel]');
      const open = !panel.classList.contains('hidden');
      document.querySelectorAll('[data-panel]').forEach(p=>p.classList.add('hidden'));
      document.querySelectorAll('.row-vac').forEach(r=>r.classList.remove('open'));
      document.querySelectorAll('.row-icon').forEach(ic=>ic.style.transform='');
      if(!open){
        panel.classList.remove('hidden');
        row.classList.add('open');
        row.querySelector('.row-icon').style.transform='rotate(45deg)';
      }
    });
  });
  document.querySelectorAll('[data-apply]').forEach(b=>{
    b.addEventListener('click', e=>{
      e.stopPropagation();
      const id = b.dataset.apply;
      if(!store.user){
        toast('Сначала войдите в систему', false);
        setTimeout(()=>location.hash='#/login', 900);
        return;
      }
      const apps = store.apps;
      if(apps.includes(id)){ toast('Этот отклик уже в вашем профиле', false); return; }
      apps.push(id); store.apps = apps;
      b.className = b.className.replace('bg-acid text-ink-950 hover:bg-mint','bg-acid/15 text-acid border border-acid/40');
      b.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i>Отклик отправлен`;
      b.classList.add('pointer-events-none');
      lucide.createIcons();
      const c = $('#apps-counter'); if(c) c.textContent = 'откликов в профиле: ' + apps.length;
      toast('Отклик сохранён — смотрите в профиле');
    });
  });
}

function initBlueprint(){
  const wrap = $('#blueprint-wrap');
  if(!wrap) return;
  const hero = wrap.closest('section');
  hero.addEventListener('mousemove', e=>{
    const r = wrap.getBoundingClientRect();
    const x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5;
    wrap.style.transform = `rotateY(${x*10}deg) rotateX(${-y*10}deg)`;
  });
  hero.addEventListener('mouseleave', ()=> wrap.style.transform='');
}

/* ============================ АВТ-ФОРМЫ ============================ */
function fieldHTML(id, type, label, icon, extra=''){
  return `
  <label class="block">
    <span class="font-mono text-[10px] uppercase tracking-[.25em] text-fog flex items-center gap-2 mb-2"><i data-lucide="${icon}" class="w-3.5 h-3.5 text-acid"></i>${label}</span>
    <span class="field flex items-center gap-3 rounded border border-mint/15 bg-ink-900/60 px-4">
      <input id="${id}" type="${type}" ${extra} class="w-full bg-transparent py-3.5 text-sm text-white placeholder:text-fog/50" placeholder="${label}">
      ${type==='password'?`<button type="button" data-eye="${id}" class="text-fog hover:text-acid transition-colors"><i data-lucide="eye" class="w-4 h-4"></i></button>`:''}
    </span>
    <span class="block font-mono text-[11px] text-red-400 mt-1.5 h-4" data-err="${id}"></span>
  </label>`;
}

function bindPasswordToggles(root){
  root.querySelectorAll('[data-eye]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const inp = document.getElementById(b.dataset.eye);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      b.innerHTML = `<i data-lucide="${show?'eye-off':'eye'}" class="w-4 h-4"></i>`;
      lucide.createIcons();
    });
  });
}
function setErr(id, msg){
  const el = document.querySelector(`[data-err="${id}"]`);
  if(el) el.textContent = msg || '';
}

    </div>
  </section>`;
  lucide.createIcons();
  bindPasswordToggles(app);
  $('#login-form').addEventListener('submit', e=>{
    e.preventDefault();
    const email = $('#li-email').value.trim(), pass = $('#li-pass').value;
    let ok = true;
    setErr('li-email', !/^\S+@\S+\.\S+$/.test(email) ? 'Некорректный e-mail' : '') || (ok = ok && /^\S+@\S+\.\S+$/.test(email));
    setErr('li-pass', pass.length < 6 ? 'Минимум 6 символов' : '');

        <ul class="mt-8 space-y-4 max-w-sm">
          ${[['hash','Локальное хранение — данные не покидают браузер'],['radar','Идентификатор кандидата генерируется автоматически'],['git-branch','Отклики синхронизируются с вашим профилем']].map(([i,t])=>`

/* ============================ СТРАНИЦА: ПРОФИЛЬ ============================ */
function renderProfile(){
  const u = store.user;
  if(!u){ toast('Требуется авторизация', false); location.hash = '#/login'; return; }
  const apps = store.apps, skills = store.skills;
  const initials = u.name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const appliedVacs = apps.map(id => VACANCIES.find(v=>v.id===id)).filter(Boolean);
  const fill = Math.min(100, 35 + skills.length*8 + appliedVacs.length*9);

  app.innerHTML = `
  <section class="max-w-7xl mx-auto px-5 md:px-8 py-12 md:py-16 flex-1">
    <p class="font-mono text-[11px] uppercase tracking-[.3em] text-acid mb-6">// CANDIDATE.CONSOLE</p>
    <div class="grid lg:grid-cols-[1fr_380px] gap-6">

      <!-- левая колонка -->
      <div class="space-y-6">
        <div class="glass brackets rounded p-7 md:p-9"><span class="bk"></span>
          <div class="flex flex-col sm:flex-row sm:items-center gap-6">
            <div class="w-20 h-20 rounded border border-acid/40 bg-ink-800 flex items-center justify-center font-display text-2xl text-acid shrink-0" style="font-weight:800">${initials}</div>
            <div class="min-w-0">
              <h1 class="font-display text-2xl md:text-3xl truncate" style="font-weight:600">${u.name}</h1>
              <p class="text-mint/60 text-sm mt-1 truncate">${u.email}</p>
              <div class="flex flex-wrap gap-x-6 gap-y-1 mt-3 font-mono text-[11px] uppercase tracking-widest text-fog">
                <span>ID: <span class="text-acid">${u.id}</span></span>
                <span>С нами с: <span class="text-mint/80">${new Date(u.since).toLocaleDateString('ru-RU')}</span></span>
              </div>
            </div>
            <button id="logout" class="sm:ml-auto shrink-0 inline-flex items-center gap-2 font-mono text-xs uppercase tracking-widest px-4 py-3 rounded border border-red-400/30 text-red-300 hover:bg-red-400/10 transition-colors">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i>Выйти
            </button>
          </div>
        </div>

        <!-- отклики -->
        <div class="glass rounded">
          <div class="flex items-center justify-between px-7 py-4 border-b border-mint/10">
            <h2 class="font-display text-lg" style="font-weight:600">Мои отклики</h2>
            <span class="font-mono text-xs text-fog">${appliedVacs.length} активн.</span>
          </div>

          <div class="flex items-center gap-5 px-7 py-5 border-b border-mint/10 last:border-b-0">
            <span class="font-mono text-xs text-fog hidden sm:block">${v.id}</span>
            <div class="min-w-0">
              <p class="font-medium truncate">${v.title}</p>
              <p class="font-mono text-[11px] text-fog uppercase tracking-widest mt-0.5">${v.team} · ${v.loc}</p>
            </div>
            <span class="ml-auto shrink-0 inline-flex items-center gap-1.5 font-mono text-[10px] uppercase tracking-widest text-acid border border-acid/30 rounded px-2.5 py-1.5">
              <i data-lucide="clock-3" class="w-3 h-3"></i>На рассмотрении
            </span>
          </div>`).join('')
          : `
          <div class="px-7 py-12 text-center">
            <i data-lucide="inbox" class="w-8 h-8 text-fog mx-auto mb-4"></i>
            <p class="text-mint/60 text-sm mb-5">Пока ни одного отклика. Реестр направлений ждёт.</p>
            <a href="#/" class="inline-flex items-center gap-2 font-mono text-xs uppercase tracking-widest text-acid border border-acid/40 rounded px-5 py-3 hover:bg-acid/10 transition-colors">
              К позициям <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
            </a>
          </div>`}
        </div>
      </div>

      <!-- правая колонка -->
      <div class="space-y-6">
        <div class="glass rounded p-7">
          <h2 class="font-display text-lg mb-5" style="font-weight:600">Заполненность профиля</h2>
          <div class="flex items-end gap-2 mb-2">
            <span class="font-display text-4xl text-acid" style="font-weight:600">${fill}%</span>
            <span class="font-mono text-[10px] uppercase tracking-widest text-fog mb-1.5">готовности</span>
          </div>

          <i data-lucide="arrow-up-right" class="w-4 h-4 text-acid group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
        </a>
      </div>
    </div>
  </section>`;

  lucide.createIcons();
  $('#logout').addEventListener('click', ()=>{

  $('#skill-form').addEventListener('submit', e=>{

      const s = store.skills.filter(x=>x!==b.dataset.skill);
      store.skills = s; renderProfile(); toast('Навык удалён');

  });
}

/* ============================ РОУТЕР ============================ */
const routes = { '':renderHome, 'home':renderHome, 'login':renderLogin, 'register':renderRegister, 'profile':renderProfile };
function router(){
  const hash = location.hash.replace('#/','').replace('#','');
  (routes[hash] || renderHome)();
  window.scrollTo({top:0});
  renderNav();
}
function renderNav(){
  const u = store.user;
  const current = location.hash.replace('#/','').replace('#','');
  document.querySelectorAll('[data-nav]').forEach(a=>{
    a.classList.toggle('active', a.dataset.nav === current || (a.dataset.nav==='home' && current===''));
    a.classList.toggle('text-acid', a.dataset.nav === current || (a.dataset.nav==='home' && current===''));
  });
  $('#nav-auth').innerHTML = u
    ? `<a href="#/profile" class="hidden sm:flex items-center gap-2.5 glass-soft rounded pl-2 pr-4 py-1.5 hover:border-acid/40 transition-colors">
         <span class="w-7 h-7 rounded-sm bg-acid text-ink-950 font-mono text-xs font-bold flex items-center justify-center">${u.name[0].toUpperCase()}</span>
         <span class="font-mono text-xs text-mint/80 max-w-[120px] truncate">${u.name}</span>
       </a>`
    : `<a href="#/login" class="font-mono text-xs uppercase tracking-widest text-mint/80 hover:text-acid transition-colors px-2">Вход</a>
       <a href="#/register" class="font-mono text-xs uppercase tracking-widest bg-acid text-ink-950 px-4 py-2.5 rounded hover:bg-mint transition-colors">Регистрация</a>`;
}
window.addEventListener('hashchange', router);
router();
lucide.createIcons();
</script>
