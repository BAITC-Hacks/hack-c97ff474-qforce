# Keep the backend project identity and its existing PostgreSQL volume.
name: career-quest

include:
  - path:
      - ./backend/compose.yaml
      - ./compose.backend.yaml

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: career-quest-frontend:local
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_API_BASE: http://api:3001
      NUXT_PUBLIC_API_BASE: /api/v1
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    init: true
    restart: unless-stopped
