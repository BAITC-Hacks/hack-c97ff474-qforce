# Merged after backend/compose.yaml; paths are relative to backend/.
# Preserve its defaults and backend/.env, then apply the optional root .env.
x-root-environment: &root-environment
  env_file:
    - path: ../.env
      required: false

services:
  migrate:
    <<: *root-environment
  bootstrap:
    <<: *root-environment
    environment:
      DATA_MODE: ${DATA_MODE:-input}
      DEMO_EMPLOYEE_ID: ${DEMO_EMPLOYEE_ID:-E0001}
    volumes:
      - type: bind
        source: ${INPUT_DATA_DIR:-../frontend/app/data}
        target: /app/data/input
        read_only: true
  api:
    <<: *root-environment
    environment:
      DATA_MODE: ${DATA_MODE:-input}
      DEMO_EMPLOYEE_ID: ${DEMO_EMPLOYEE_ID:-E0001}
